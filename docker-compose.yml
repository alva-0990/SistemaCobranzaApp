services:
  postgres:
    image: postgres:16-alpine
    container_name: cobranza_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=America/Mexico_City"]
    environment:
      POSTGRES_DB: sistema_cobranza
      POSTGRES_USER: cobranza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobranza_dev}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    volumes:
      - ./cobranza_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cobranza_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobranza -d sistema_cobranza"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Publica el puerto SOLO si necesitas conectarte a la BD desde el host (p. ej. DBeaver).
    # En producción puedes dejarlo comentado: la API llega a Postgres por la red interna.
    ports:
      - "127.0.0.1:5432:5432"

  # Evolution API: pasarela a WhatsApp (solo notificaciones salientes).
  # Evolution v2 REQUIERE una base de datos para guardar la sesión del WhatsApp vinculado,
  # por lo que reutiliza el mismo Postgres en una base aparte llamada 'evolution'.
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    container_name: cobranza_evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Esta clave DEBE ser la misma que WHATSAPP_APIKEY (la que usa la API para autenticar).
      AUTHENTICATION_API_KEY: ${WHATSAPP_APIKEY}
      # Persistencia en Postgres (base 'evolution' en el mismo servidor de la cobranza).
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://cobranza:${POSTGRES_PASSWORD_URL:-cobranza_dev}@postgres:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: cobranza_evolution
      # Qué guarda en la base (lo mínimo para notificaciones salientes).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      TZ: America/Mexico_City
    volumes:
      # Sesión de WhatsApp (credenciales del QR): si se borra, hay que re-vincular.
      - ./evolution_instances:/evolution/instances
    networks:
      - cobranza_net
    # Publica la consola/API de Evolution SOLO en el host (para crear la instancia y escanear
    # el QR). La API de cobranza la alcanza por la red interna como http://evolution:8080.
    ports:
      - "127.0.0.1:8083:8080"

  api:
    build:
      context: .
      dockerfile: SistemaCobranzaApp.Api/Dockerfile
    image: cobranza-api
    container_name: cobranza_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      # La API alcanza Postgres por el nombre de servicio 'postgres' en la red interna.
      ConnectionStrings__Cobranza: "Host=postgres;Port=5432;Database=sistema_cobranza;Username=cobranza;Password=${POSTGRES_PASSWORD:-cobranza_dev}"
      Jwt__Issuer: SistemaCobranza
      Jwt__Audience: SistemaCobranza
      Jwt__Key: ${JWT_KEY}
      Jwt__MinutosVigencia: ${JWT_MINUTOS:-900}
      # --- WhatsApp (Evolution API) ---
      Whatsapp__BaseUrl: ${WHATSAPP_BASEURL:-}
      Whatsapp__Instancia: ${WHATSAPP_INSTANCIA:-}
      Whatsapp__ApiKey: ${WHATSAPP_APIKEY:-}
      Whatsapp__WebhookSecret: ${WHATSAPP_WEBHOOK_SECRET:-}
      # --- WhatsApp API oficial (Meta Cloud API). Solo se usa si WHATSAPP_PROVEEDOR = OFICIAL ---
      WhatsappOficial__PhoneNumberId: ${WHATSAPP_OFICIAL_PHONE_NUMBER_ID:-}
      WhatsappOficial__AccessToken: ${WHATSAPP_OFICIAL_ACCESS_TOKEN:-}
      WhatsappOficial__VersionApi: ${WHATSAPP_OFICIAL_VERSION_API:-v21.0}
    networks:
      - cobranza_net

  web:
    build:
      context: .
      dockerfile: SistemaCobranzaApp.Web/Dockerfile
    image: cobranza-web
    container_name: cobranza_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # El Web consume la API por su URL pública (Cloudflare) para que el navegador del
      # cliente resuelva los mismos enlaces. Si prefieres tráfico interno, usa http://api:8081.
      ApiSettings__BaseUrl: ${WEB_API_BASEURL:-https://api.cobragil.com}
    networks:
      - cobranza_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cobranza_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token del túnel creado en el panel de Cloudflare (Zero Trust → Tunnels).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - api
      - web
    networks:
      - cobranza_net

volumes:
  cobranza_pgdata:
    name: cobranza_pgdata

networks:
  cobranza_net:
    name: cobranza_net
